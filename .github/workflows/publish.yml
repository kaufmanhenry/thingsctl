name: Publish

# Releases are cut by pushing a version tag:
#   npm version <level> --no-git-tag-version  (or edit package.json)
#   git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z
#
# Authentication is trusted publishing (OIDC): npm trusts this specific
# workflow file in this specific repo, so there is no npm token stored anywhere
# and nothing to expire. The trust is configured on npmjs.com under
# Package settings -> Trusted Publisher, and it pins the filename "publish.yml"
# exactly — renaming this file breaks publishing with ENEEDAUTH.

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # required for OIDC; without it npm falls back to a token and fails
  contents: read

jobs:
  publish:
    # macos-latest matches ci.yml. The package is macOS-only and the suite has
    # only ever been exercised there; a release is the wrong place to find out
    # whether it passes on Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # NOT 24, whatever npm's docs example says: better-sqlite3 11.x ships
          # no prebuilt binary for Node 24 (ABI 137), so `npm ci` leaves the
          # native module unbuilt and the fixture step dies before publish ever
          # runs. 22 is the newest version ci.yml actually exercises.
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache in a release build: the artifact that goes to
          # the registry should be built from a clean install every time.

      # OIDC support landed in npm 11.5.x, newer than the npm bundled with
      # Node 22, so upgrade explicitly. npm@latest needs Node ^22.22.2, which
      # setup-node's "22" satisfies. Versions are echoed so a future runner
      # image change is diagnosable from the log alone.
      - name: Ensure npm supports OIDC
        run: |
          node --version
          npm install -g npm@latest
          npm --version

      - name: Refuse to publish if the tag and package.json disagree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: npm ci
      - run: npm run fixture
      - run: npm test

      # No NODE_AUTH_TOKEN. Authentication comes from the OIDC exchange, and
      # provenance is attached automatically for a public repo + public package.
      - run: npm publish
